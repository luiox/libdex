name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: docs (引用门禁 + Sphinx + Doxygen)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sphinx
        # 钉死本地实测通过的版本：-W 下警告集合随 Sphinx 小版本变，范围安装等于定时炸；升级随文档批次显式改这一行。
        run: python -m pip install --upgrade "sphinx==9.1.1"

      - name: Reference gate (check_refs)
        run: python doc/check_refs.py .

      # -E：增量缓存会跳过「回到旧状态」的文件，警告随之消失，等于没门禁。
      - name: "Build design docs (-W: 警告即失败)"
        run: sphinx-build -b html -E -W --keep-going doc doc/_build

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: libdex-doc-html
          path: doc/_build
          retention-days: 14

      # 微观层：Doxygen 只吃头文件 /// 注释，与 RST 站互不干涉。
      # 版本必须钉死（与本地实测同版）：Doxyfile 的 WARN_* 档随版本增减标签，
      # 老版本会把「不认识的标签」报成告警，WARN_AS_ERROR 下直接变红。
      - name: Install Doxygen (pinned 1.18.0)
        run: |
          curl -fsSL https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz -o /tmp/dox.tar.gz
          mkdir -p "$HOME/doxygen"
          tar xzf /tmp/dox.tar.gz -C "$HOME/doxygen" --strip-components=1
          test -x "$HOME/doxygen/bin/doxygen"
          echo "$HOME/doxygen/bin" >> "$GITHUB_PATH"

      # GITHUB_PATH 的追加不回灌当前步，PATH 自本步起生效；版本打印放这里。
      - name: Build API docs (WARN_AS_ERROR)
        run: |
          doxygen --version
          doxygen doc/Doxyfile

      - name: Upload API site
        uses: actions/upload-artifact@v4
        with:
          name: libdex-doc-apidoc
          path: doc/_apidoc/html
          retention-days: 14

  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest 开始迁往 Ubuntu 26；d8 语料依赖 runner 预装的
        # Android SDK，镜像换代前固定在已验证的 24.04。
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.0.9
          package-cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v6
        with:
          path: .oracle-cache
          key: oracle-baksmali-2.5.2-${{ runner.os }}
          restore-keys: |
            oracle-baksmali-2.5.2-

      - name: configure
        run: xmake f -y --with_tests=y

      - name: build
        run: |
          xmake build libdex_unittest
          xmake build dexbuild
          xmake build smalict

      - name: unit tests
        run: xmake run libdex_unittest --gtest_brief=1

      - name: smalict smoke
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          smalict="$(find build -maxdepth 4 -type f \( -name smalict -o -name smalict.exe \) | head -n 1)"
          test -n "$smalict"
          mkdir -p "$tmp/smali"
          printf '%s\n' \
            '.class public LSmoke;' \
            '.super Ljava/lang/Object;' \
            '.method public static f()Ljava/lang/String;' \
            '    .registers 1' \
            '    const-string v0, "hi"' \
            '    return-object v0' \
            '.end method' > "$tmp/smali/Smoke.smali"
          "$smalict" asm "$tmp/smali" "$tmp/smoke.dex"
          "$smalict" roundtrip "$tmp/smoke.dex" "$tmp"

      - name: oracle (synthetic fixture)
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          dexbuild="$(find build -maxdepth 4 -type f \( -name dexbuild -o -name dexbuild.exe \) | head -n 1)"
          test -n "$dexbuild"
          "$dexbuild" fixture "$tmp/hello.dex"
          sh tools/oracle/check.sh "$tmp/hello.dex" "$dexbuild"

      # ---- 以下仅 Linux：redex 只有 Linux/macOS 构建，d8 语料生成用
      # runner 预装的 Android SDK build-tools。----

      # redex 是可选 oracle：check.sh 在二进制缺席时明确 skip（exit 0）。
      # ubuntu runner 无 brew、redex 也无官方 Linux 二进制，装不上不算失败。
      - name: install redex (best effort)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          if command -v brew >/dev/null 2>&1; then
            brew install redex
          else
            echo "oracle skip: brew unavailable on runner; redex mode will skip"
          fi

      - name: corpus (d8)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: tools/corpus/gen_corpus.sh build/corpus

      - name: oracle (baksmali over corpus)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          dexbuild="$(find build -maxdepth 4 -type f -name dexbuild | head -n 1)"
          test -n "$dexbuild"
          for dex in build/corpus/corpus_*.dex; do
            sh tools/oracle/check.sh "$dex" "$dexbuild"
          done

      # redex 双边管线对比首跑尚未在实机验证；观察若干次绿后移除
      # continue-on-error，让它参与门禁。
      - name: oracle (redex roundtrip over corpus)
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          dexbuild="$(find build -maxdepth 4 -type f -name dexbuild | head -n 1)"
          test -n "$dexbuild"
          for dex in build/corpus/corpus_*.dex; do
            LIBDEX_ORACLE_MODE=redex sh tools/oracle/check.sh "$dex" "$dexbuild"
          done
